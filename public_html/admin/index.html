<!doctype html>
<html lang="es-CL">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Terreno DTH · Panel admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css?v=19">
</head>
<body>

  <!-- Pantalla de login -->
  <div id="login-screen" class="login-screen">
    <div class="login-card">
      <h1>Terreno DTH</h1>
      <p class="login-subtitulo">Panel administrativo</p>
      <div id="login-form-container"></div>
    </div>
  </div>

  <!-- Cáscara de la app (oculta hasta confirmar sesión) -->
  <div id="shell" hidden>
    <header class="topbar">
      <a href="#inicio" class="topbar-marca" title="Volver al inicio">Terreno DTH <span>· admin</span></a>
      <nav class="topbar-nav">
        <a href="#inicio" class="nav-link" data-route="inicio">Inicio</a>
        <a href="#bodega" class="nav-link" data-route="bodega">Bodega</a>
        <a href="#billetera" class="nav-link" data-route="billetera">Billetera</a>
        <a href="#tarifario" class="nav-link" data-route="tarifario">Tarifario</a>
        <a href="#usuarios" class="nav-link" data-route="usuarios">Usuarios</a>
        <a href="#historial" class="nav-link" data-route="historial">Informes</a>
      </nav>
      <div class="topbar-usuario">
        <div id="admin-reloj-fecha-hora" class="topbar-reloj"></div>
        <span id="pendientes-badge" class="chip chip--alerta" title="Acciones guardadas sin conexión, esperando señal" hidden></span>
        <span id="usuario-nombre"></span>
        <button type="button" id="ajustes-btn" class="btn btn--texto" title="Ajustes de mi cuenta">⚙ Ajustes</button>
        <button type="button" id="logout-btn" class="btn btn--texto">Salir</button>
      </div>
    </header>
    <main id="view"></main>
  </div>

  <!-- Modal genérico (rechazo, observar, resolver conflicto, lightbox) -->
  <div id="modal-overlay" class="modal-overlay" hidden>
    <div id="modal-contenido" class="modal-caja"></div>
  </div>

  <!-- Notificaciones -->
  <div id="toast-pila" class="toast-pila" aria-live="polite"></div>

  <!-- Vendorizada localmente, misma librería que usa la app técnico (ver
       docs/admin-api.md) — carga como script clásico porque expone un
       global (window.Html5Qrcode), no un módulo ES. `defer` evita que
       bloquee el parseo del HTML mientras se descarga. -->
  <script src="js/vendor/html5-qrcode.min.js" defer></script>
  <script type="module" src="js/app.js?v=20"></script>
</body>
</html>
