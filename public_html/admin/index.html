<!doctype html>
<html lang="es-CL">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Terreno DTH · Panel admin</title>
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>

  <!-- Pantalla de login -->
  <div id="login-screen" class="login-screen">
    <div class="login-card">
      <h1>Terreno DTH</h1>
      <p class="login-subtitulo">Panel administrativo</p>
      <div id="login-form-container"></div>
    </div>
  </div>

  <!-- Cáscara de la app (oculta hasta confirmar sesión) -->
  <div id="shell" hidden>
    <aside class="riel">
      <a href="#inicio" class="riel-marca" title="Volver al inicio">
        <span class="riel-isotipo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11a8 8 0 0 1 8-8"/><path d="M4 11a8 8 0 0 0 8 8"/><circle cx="12" cy="11" r="2.4" fill="currentColor" stroke="none"/><path d="M20 11a8 8 0 0 0-1.6-4.8"/></svg></span>
        <span class="riel-marca-texto"><strong>Terreno DTH</strong><span>Admin</span></span>
      </a>
      <nav class="riel-nav">
        <a href="#inicio" class="nav-link" data-route="inicio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Inicio</a>
        <a href="#bodega" class="nav-link" data-route="bodega"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 7.5 12 4l9 3.5v9L12 20l-9-3.5z"/><path d="M12 11v9M3 7.5 12 11l9-3.5"/></svg>Bodega</a>
        <a href="#billetera" class="nav-link" data-route="billetera"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="6" width="18" height="13" rx="1.5"/><path d="M3 10h18"/></svg>Billetera</a>
        <a href="#tarifario" class="nav-link" data-route="tarifario"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3h6a1.8 1.8 0 0 1 1.8 1.8v6L11 20 3 12l8.8-9Z"/></svg>Tarifario</a>
        <a href="#usuarios" class="nav-link" data-route="usuarios"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.6 2.7-6 6-6s6 2.4 6 6"/><path d="M15.5 8a2.7 2.7 0 0 1 0 5"/><path d="M17.3 14c2 .4 3.7 2.2 3.7 6"/></svg>Usuarios</a>
        <a href="#historial" class="nav-link" data-route="historial"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="4" width="14" height="17" rx="1.5"/><path d="M8.3 11h7.4M8.3 15h7.4"/></svg>Informes</a>
      </nav>
      <div class="riel-pie">
        <span id="pendientes-badge" class="chip chip--alerta" title="Acciones guardadas sin conexión, esperando señal" hidden></span>
        <div class="riel-usuario"><strong id="usuario-nombre"></strong><span>Administrador</span></div>
        <div class="riel-acciones">
          <button type="button" id="ajustes-btn" class="btn btn--texto" title="Ajustes de mi cuenta">⚙ Ajustes</button>
          <button type="button" id="logout-btn" class="btn btn--texto">Salir</button>
        </div>
      </div>
    </aside>
    <main id="view"></main>
  </div>

  <!-- Modal genérico (rechazo, observar, resolver conflicto, lightbox) -->
  <div id="modal-overlay" class="modal-overlay" hidden>
    <div id="modal-contenido" class="modal-caja"></div>
  </div>

  <!-- Notificaciones -->
  <div id="toast-pila" class="toast-pila" aria-live="polite"></div>

  <!-- Vendorizada localmente, misma librería que usa la app técnico (ver
       docs/admin-api.md) — carga como script clásico porque expone un
       global (window.Html5Qrcode), no un módulo ES. `defer` evita que
       bloquee el parseo del HTML mientras se descarga. -->
  <script src="js/vendor/html5-qrcode.min.js" defer></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
